services:
  # 1. Chế độ Chỉnh sửa & Xem trực tiếp (Development với Hot-Reload)
  # Chạy bằng lệnh: docker compose up myblog-dev
  # Truy cập: http://localhost:4000
  myblog-dev:
    build:
      context: .
      target: dev
    container_name: myblog_dev
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: bundle exec jekyll serve --host 0.0.0.0 --port 4000 --baseurl "" --livereload --force_polling

  # 2. Chế độ Host thực tế (Production phục vụ qua Nginx)
  # Chạy bằng lệnh: docker compose up -d myblog-prod
  # Truy cập: http://localhost:8080
  myblog-prod:
    build:
      context: .
      target: prod
    container_name: myblog_prod
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  bundle_cache:
